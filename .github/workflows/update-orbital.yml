name: Update public orbital snapshots
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  # Run a real integration check when the updater or its workflow changes on this branch.
  push:
    branches:
      - feature/dashboard-v1-2-interactions
    paths:
      - ".github/workflows/update-orbital.yml"
      - "scripts/update_orbital_snapshot.py"
permissions:
  contents: write
concurrency:
  group: orbital-snapshot-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve and archive public orbital datasets
        run: python scripts/update_orbital_snapshot.py
      - name: Commit changed snapshots and source log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orbital data/source-log.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: archive public orbital source snapshots"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
