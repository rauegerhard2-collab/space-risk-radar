name: Update public orbital snapshot
on:
  schedule:
    # Once daily: deliberately conservative, below CelesTrak's published update cadence.
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orbital-snapshot-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-v1-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve and archive one STATIONS OMM dataset
        run: python scripts/update_orbital_snapshot.py
      - name: Commit changed snapshot and source log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orbital data/source-log.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: archive daily CelesTrak STATIONS snapshot"
            git push origin HEAD:feature/dashboard-v1-1
          fi
