name: Dashboard browser smoke test
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "data/source-log.jsonl"
      - "tests/**"
      - ".github/workflows/dashboard-browser-smoke.yml"
  push:
    branches:
      - feature/dashboard-v1-2-interactions
    paths:
      - "index.html"
      - "data/source-log.jsonl"
      - "tests/**"
      - ".github/workflows/dashboard-browser-smoke.yml"
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve dashboard
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/space-risk-radar-http.log 2>&1 &
          echo $! > /tmp/space-risk-radar-http.pid
      - name: Run desktop and mobile smoke tests
        run: node tests/browser-smoke.mjs
